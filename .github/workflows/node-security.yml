name: Node security qualification
on:
  pull_request:
  push:
    branches: [master, production]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      HOSTING_DOMAIN: https://example.invalid
      DOJO_URL: https://example.invalid
      ROUTING_PREFIX: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
      - run: npm ci
      - run: npm run build
      - run: find src scripts -name "*.js" -print0 | xargs -0 -n1 node --check
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag node-security-qualified .
      - name: Verify Linux runtime and locked application dependencies
        run: |
          docker run --rm --network=none --entrypoint node node-security-qualified -e '
            const assert = require("node:assert/strict");
            assert.equal(process.version, "v22.23.4");
            assert.equal(process.arch, "x64");
            const z = require("node:zlib");
            assert.equal(z.brotliDecompressSync(z.brotliCompressSync(Buffer.from("security"))).toString(), "security");
            require("express"); require("knex"); require("mysql");
            console.log("Patched Linux runtime and application module loading passed");
          '
